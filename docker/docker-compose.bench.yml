services:
  ousagi:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/bin/server", "-p", "11211", "-t", "${THREADS:-4}"]
    environment:
      - RUST_LOG=info
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "1024M"
    networks:
      - bench

  memcached:
    image: memcached:1.6.45-alpine3.24
    command: ["-p", "11211", "-t", "${THREADS:-4}", "-m", "1024"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "1024M"
    networks:
      - bench

  memtier:
    image: redislabs/memtier_benchmark:2.5.1
    networks:
      - bench

networks:
  bench:
    driver: bridge
