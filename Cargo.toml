[package]
name = "ousagi"
version = "0.3.1"
edition = "2024"
authors = ["dnlzrgz <contact@dnlzrgz.com>"]
description = "memcached's text protocol clone."
license = "MIT"
readme = "README.md"
repository = "https://github.com/dnlzrgz/ousagi"
keywords = ["async", "cache", "cache-server", "memcached", "tokio"]
categories = ["caching", "command-line-utilities", "network-programming"]
publish = false

[[bench]]
harness = false
name = "parser"

[[bench]]
harness = false
name = "store"

[[bench]]
harness = false
name = "connection"

[dependencies]
atoi = "3.1.0"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
contatori = "0.7.5"
itoa = "1.0.18"
memchr = "2.8.3"
quick_cache = "0.7.0"
thread_local = "1.1.10"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
